<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מחולל הלוואות וקודי מוסד | קפלן דהאן</title>
<style>
  :root{
    --navy:#0f2942;
    --navy-2:#16385a;
    --gold:#b98a3d;
    --gold-light:#e8c58a;
    --bg:#f4f6f8;
    --card:#ffffff;
    --line:#e1e6ea;
    --text:#1c2b38;
    --text-dim:#5b6b78;
    --green:#2f7a4f;
    --green-bg:#eaf6ef;
    --red:#b3432b;
    --red-bg:#fdecE8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Segoe UI','Arial Hebrew','Heebo',Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  header{
    background:linear-gradient(120deg,var(--navy) 0%,var(--navy-2) 100%);
    color:#fff;
    padding:28px 20px 24px;
    position:sticky;
    top:0;
    z-index:50;
    box-shadow:0 2px 12px rgba(0,0,0,.15);
  }
  header .inner{
    max-width:1100px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  header h1{
    margin:0;
    font-size:22px;
    font-weight:700;
    letter-spacing:.2px;
  }
  header .sub{
    font-size:13px;
    color:var(--gold-light);
    margin-top:4px;
    font-weight:500;
  }
  .search-wrap{
    position:relative;
    min-width:260px;
    flex:0 0 auto;
  }
  .search-wrap input{
    width:100%;
    padding:11px 40px 11px 14px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08);
    color:#fff;
    font-size:14px;
    outline:none;
  }
  .search-wrap input::placeholder{color:rgba(255,255,255,.55);}
  .search-wrap input:focus{
    border-color:var(--gold-light);
    background:rgba(255,255,255,.14);
  }
  .search-wrap svg{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    opacity:.6;
  }

  .layout{
    max-width:700px;
    margin:0 auto;
    padding:22px 18px 60px;
  }

  nav.companies{
    position:sticky;
    top:112px;
    display:flex;
    flex-direction:column;
    gap:6px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px;
  }
  @media (max-width:800px){
    nav.companies{
      position:static;
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
    }
  }
  nav.companies button{
    all:unset;
    cursor:pointer;
    padding:10px 12px;
    border-radius:9px;
    font-size:14px;
    font-weight:600;
    color:var(--text);
    text-align:center;
    transition:background .15s,color .15s;
  }
  nav.companies button:hover{background:var(--bg);}
  nav.companies button.active{
    background:var(--navy);
    color:#fff;
  }
  nav.companies .missing-btn{
    color:var(--text-dim);
    font-weight:500;
    font-size:12.5px;
    cursor:default;
  }
  nav.companies .missing-btn:hover{background:none;}
  nav.companies .divider{
    border-top:1px solid var(--line);
    margin:6px 4px;
  }
  nav.companies .group-label{
    font-size:11px;
    color:var(--text-dim);
    padding:6px 10px 2px;
    font-weight:700;
    letter-spacing:.3px;
  }

  main{min-width:0;}

  .company-panel{display:none;}
  .company-panel.active{display:block; animation:fadeIn .18s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .company-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:16px;
  }
  .company-head h2{
    margin:0;
    font-size:21px;
    color:var(--navy);
  }
  .company-head .tag{
    font-size:12px;
    background:var(--gold);
    color:#fff;
    padding:4px 10px;
    border-radius:20px;
    font-weight:700;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 18px 20px;
    margin-bottom:16px;
  }
  .card h3{
    margin:0 0 12px;
    font-size:15px;
    color:var(--navy-2);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card h3 .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--gold);
    display:inline-block;
  }
  .card .note{
    font-size:13px;
    color:var(--text-dim);
    background:var(--bg);
    border-radius:8px;
    padding:8px 12px;
    margin-top:10px;
  }
  .compact-card{
    padding:12px 14px 14px;
    max-width:480px;
  }
  .compact-card h3{
    font-size:12.5px;
    color:var(--text-dim);
    margin-bottom:8px;
  }
  .compact-card table{font-size:12px;}
  .compact-card th{font-size:11px; padding:6px 8px;}
  .compact-card td{padding:6px 8px;}
  .compact-card .note{font-size:11.5px; padding:6px 10px;}

  table{
    width:100%;
    border-collapse:collapse;
    font-size:13.5px;
  }
  th,td{
    padding:9px 10px;
    text-align:right;
    border-bottom:1px solid var(--line);
    vertical-align:top;
  }
  th{
    color:var(--text-dim);
    font-weight:700;
    font-size:12.5px;
    background:var(--bg);
    position:sticky;
    top:0;
  }
  tr:last-child td{border-bottom:none;}
  td.code, td.acct{
    font-variant-numeric:tabular-nums;
    font-family:'Consolas','Courier New',monospace;
    font-weight:700;
    color:var(--navy);
    direction:ltr;
    text-align:left;
    unicode-bidi:plaintext;
  }
  .table-scroll{overflow-x:auto;}

  .subgroup{margin-top:14px;}
  .subgroup > .subtitle{
    font-size:13px;
    font-weight:700;
    color:var(--text);
    margin:14px 0 8px;
    padding-right:10px;
    border-right:3px solid var(--gold);
  }

  .copy-btn{
    all:unset;
    cursor:pointer;
    font-size:11px;
    color:var(--navy-2);
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:6px;
    padding:2px 7px;
    margin-right:6px;
    font-family:inherit;
    font-weight:600;
  }
  .copy-btn:hover{background:#e6ecf1;}
  .copy-btn.copied{background:var(--green-bg); color:var(--green); border-color:var(--green);}

  .links-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
  }
  .links-row a{
    font-size:12.5px;
    color:var(--navy-2);
    background:var(--bg);
    border:1px solid var(--line);
    padding:6px 12px;
    border-radius:8px;
    text-decoration:none;
    font-weight:600;
  }
  .links-row a:hover{background:#e6ecf1;}

  .missing-panel .card{border-style:dashed;}
  .missing-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
  }
  .missing-list span{
    background:var(--red-bg);
    color:var(--red);
    font-size:13px;
    font-weight:700;
    padding:6px 14px;
    border-radius:20px;
  }

  .hidden-row{display:none !important;}

  .landing-grid{
    display:none;
  }
  .landing-grid.active{
    display:block;
  }
  .landing-grid h2{
    color:var(--navy);
    font-size:19px;
    margin:0 0 4px;
  }
  .landing-grid .landing-sub{
    color:var(--text-dim);
    font-size:13.5px;
    margin-bottom:20px;
  }
  .landing-cards{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:12px;
  }
  .landing-cards button{
    all:unset;
    cursor:pointer;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 14px;
    text-align:center;
    font-weight:700;
    font-size:14.5px;
    color:var(--text);
    transition:transform .12s, box-shadow .12s, border-color .12s;
  }
  .landing-cards button:hover{
    border-color:var(--gold);
    box-shadow:0 4px 14px rgba(15,41,66,.1);
    transform:translateY(-2px);
  }
  .landing-cards button.all-card{
    grid-column:1 / -1;
    background:linear-gradient(120deg,var(--navy) 0%,var(--navy-2) 100%);
    color:#fff;
    font-size:15.5px;
  }
  .landing-cards button.all-card:hover{border-color:var(--gold-light);}

  .back-to-menu{
    display:inline-flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
    font-size:13px;
    color:var(--navy-2);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px 14px;
    margin-bottom:14px;
    font-weight:600;
  }
  .back-to-menu:hover{background:var(--bg);}

  .all-companies-view .company-panel{
    display:block !important;
    margin-bottom:6px;
    padding-bottom:18px;
    border-bottom:2px solid var(--line);
  }
  .all-companies-view .company-panel:last-child{border-bottom:none;}

  .product-mode{margin-bottom:6px;}
  .product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:8px;
    margin-bottom:16px;
  }
  .product-btn{
    all:unset;
    cursor:pointer;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 10px;
    text-align:center;
    font-size:13px;
    font-weight:600;
    color:var(--text);
    transition:border-color .12s, background .12s;
  }
  .product-btn:hover{border-color:var(--gold); background:var(--bg);}
  .product-detail-card{border:1.5px solid var(--gold);}
  .detail-fields{display:flex; flex-direction:column; gap:0;}
  .detail-field{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:11px 4px;
    border-bottom:1px solid var(--line);
  }
  .detail-field:last-child{border-bottom:none;}
  .detail-label{
    font-size:12.5px;
    color:var(--text-dim);
    font-weight:600;
    flex:0 0 auto;
    min-width:150px;
  }
  .detail-value{
    font-family:'Consolas','Courier New',monospace;
    font-weight:700;
    color:var(--navy);
    direction:ltr;
    text-align:left;
    unicode-bidi:plaintext;
    flex:1;
    font-size:14px;
  }
  .full-toggle-wrap{margin-top:6px;}

  /* ---- chat mode ---- */
  .chat-view{display:none; max-width:640px; margin:0 auto;}
  .chat-view.active{display:block;}
  .chat-head{text-align:center; margin-bottom:18px;}
  .chat-head h2{color:var(--navy); font-size:20px; margin:0 0 6px;}
  .chat-head .landing-sub{margin-bottom:0;}
  .chat-switch{
    text-align:center;
    margin-bottom:16px;
  }
  .chat-log{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    min-height:220px;
    max-height:min(60vh,520px);
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:12px;
  }
  .chat-bubble{
    max-width:88%;
    padding:10px 14px;
    border-radius:14px;
    font-size:14px;
    line-height:1.55;
    white-space:pre-wrap;
  }
  .chat-bubble.user{
    align-self:flex-end;
    background:var(--navy);
    color:#fff;
    border-bottom-left-radius:4px;
  }
  .chat-bubble.bot{
    align-self:flex-start;
    background:var(--bg);
    color:var(--text);
    border-bottom-right-radius:4px;
  }
  .chat-bubble.bot .bot-field{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:4px 0;
    border-bottom:1px solid var(--line);
  }
  .chat-bubble.bot .bot-field:last-child{border-bottom:none;}
  .chat-bubble.bot .bot-field-label{color:var(--text-dim); font-size:12.5px; font-weight:600;}
  .chat-bubble.bot .bot-field-value{
    font-family:'Consolas','Courier New',monospace;
    font-weight:700;
    color:var(--navy);
    direction:ltr;
    unicode-bidi:plaintext;
  }
  .chat-bubble.bot .bot-card-title{font-weight:700; color:var(--navy); margin-bottom:6px; font-size:14.5px;}
  .chat-bubble.bot .bot-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    margin-top:6px;
  }
  .chat-bubble.bot .bot-assume{
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  .chat-bubble.bot .bot-crosslink{
    all:unset;
    cursor:pointer;
    display:inline-block;
    margin-top:8px;
    font-size:12px;
    color:var(--navy);
    background:var(--gold-light);
    border:1px solid var(--gold);
    padding:6px 12px;
    border-radius:20px;
    font-weight:600;
  }
  .chat-bubble.bot .bot-crosslink:hover{background:var(--gold);}
  .chat-form{
    display:flex;
    gap:8px;
  }
  .chat-form input{
    flex:1;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    font-size:14px;
    font-family:inherit;
  }
  .chat-form input:focus{outline:none; border-color:var(--gold);}
  .chat-form button{
    all:unset;
    cursor:pointer;
    background:var(--navy);
    color:#fff;
    padding:12px 22px;
    border-radius:10px;
    font-weight:700;
    font-size:14px;
  }
  .chat-form button:hover{background:var(--navy-2);}
  .chat-suggestions{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
  }
  .chat-suggestions button{
    all:unset;
    cursor:pointer;
    font-size:12px;
    color:var(--navy-2);
    background:var(--card);
    border:1px solid var(--line);
    padding:6px 12px;
    border-radius:20px;
  }
  .chat-suggestions button:hover{background:var(--bg);}

  footer{
    text-align:center;
    font-size:12px;
    color:var(--text-dim);
    padding:20px;
  }

  ::selection{background:var(--gold-light);}
</style>
</head>

const METHOD_LABELS = { shpitzer:'שפיצר', balloon:'בלון', grace:'גרייס' };

const INSTITUTION_TO_LOAN = {};
Object.keys(LOAN_COMPANIES).forEach(k=>{
  const ik = LOAN_COMPANIES[k].institutionKey;
  if(ik) INSTITUTION_TO_LOAN[ik] = k;
});

function computeShpitzer(P, r, n){
  const pmt = r===0 ? P/n : P*r/(1-Math.pow(1+r,-n));
  let totalInterest=0, balance=P;
  for(let i=1;i<=n;i++){
    const interest = balance*r;
    let principal = pmt-interest;
    if(i===n) principal = balance;
    balance = Math.max(balance-principal,0);
    totalInterest += interest;
  }
  return { pmt, totalInterest, totalPaid: P+totalInterest };
}

function computeBalloon(P, r, n){
  const balloonFinal = P*Math.pow(1+r,n);
  return { balloonFinal, totalInterest: balloonFinal-P, totalPaid: balloonFinal };
}

function computeGrace(P, r, n){
  const monthlyInterest = P*r;
  const finalPayment = monthlyInterest+P;
  const totalInterest = monthlyInterest*n; // n-1 interest-only months + last month's interest, same monthly amount throughout
  return { pmt: monthlyInterest, finalPayment, totalInterest, totalPaid: P+totalInterest };
}

function matchLoanCompany(qLower){
  for(const key in LOAN_COMPANIES){
    const c = LOAN_COMPANIES[key];
    if(c.aliases.some(a=>qLower.includes(a.toLowerCase()))) return key;
  }
  return null;
}

const LOAN_KEYWORDS = ['הלוואה','הלוואת','שפיצר','בלון','גרייס','סילוקין','לוח סילוקין'];
function isLoanQuestion(qLower){
  return LOAN_KEYWORDS.some(k=>qLower.includes(k));
}

function parseLoanQuery(qLower){
  let rest = qLower;

  const termMatch = rest.match(/(\d+)\s*(שנים|שנה|חודשים|חודש)/);
  let termMonths = null;
  if(termMatch){
    const num = parseInt(termMatch[1]);
    termMonths = /חוד/.test(termMatch[2]) ? num : num*12;
    rest = rest.replace(termMatch[0], ' ');
  }

  const rateMatch = rest.match(/(\d+(?:\.\d+)?)\s*%/);
  let explicitRate = null;
  if(rateMatch){
    explicitRate = parseFloat(rateMatch[1]);
    rest = rest.replace(rateMatch[0], ' ');
  }

  const amountMatch = rest.match(/(\d[\d,]*\.?\d*)\s*(אלף|אלפים|מיליון|k)?/i);
  let amount = null;
  if(amountMatch && amountMatch[1]){
    amount = parseFloat(amountMatch[1].replace(/,/g,''));
    if(amountMatch[2]){
      const unit = amountMatch[2].toLowerCase();
      if(unit==='אלף' || unit==='אלפים' || unit==='k') amount *= 1000;
      else if(unit==='מיליון') amount *= 1000000;
    }
  }

  let method = null;
  if(qLower.includes('שפיצר')) method='shpitzer';
  else if(qLower.includes('בלון')) method='balloon';
  else if(qLower.includes('גרייס')) method='grace';

  const companyKey = matchLoanCompany(qLower);

  return { amount, termMonths, explicitRate, method, companyKey };
}

function renderLoanAnswer(container, q){
  const qLower = q.toLowerCase();
  const parsed = parseLoanQuery(qLower);
  const assumptions = [];

  if(!parsed.amount){
    const p = document.createElement('div');
    p.textContent = 'כדי לחשב הלוואה אני צריכה לפחות סכום. למשל: "בלון 50000 ₪ ל-5 שנים במור" או "שפיצר 300 אלף בהראל לריבית 4.5%".';
    container.appendChild(p);
    return;
  }
  const P = parsed.amount;

  let method = parsed.method;
  if(!method){ method='shpitzer'; assumptions.push('לא צוינה שיטת החזר — הנחתי שפיצר (ברירת מחדל).'); }

  let termMonths = parsed.termMonths;
  if(!termMonths){ termMonths = 60; assumptions.push('לא צוינה תקופה — הנחתי 5 שנים (ברירת מחדל).'); }
  const termYears = termMonths/12;

  const companyKey = parsed.companyKey;
  const company = companyKey ? LOAN_COMPANIES[companyKey] : null;

  let annualRate;
  if(parsed.explicitRate!==null){
    annualRate = parsed.explicitRate;
  } else if(company && company.margins[method]!==null && company.margins[method]!==undefined){
    annualRate = PRIME_RATE + company.margins[method];
  } else if(company){
    annualRate = PRIME_RATE;
    assumptions.push(`ל${company.name} אין נתון ריבית קבוע עבור מסלול ${METHOD_LABELS[method]} — השתמשתי בריבית פריים בסיסית (${PRIME_RATE.toFixed(2)}%) ללא מרווח. ${company.note}`);
  } else {
    annualRate = PRIME_RATE;
    assumptions.push(`לא זוהתה חברה — השתמשתי בריבית פריים בסיסית (${PRIME_RATE.toFixed(2)}%) ללא מרווח. אפשר לציין שם חברה (למשל "במור") או ריבית מפורשת (למשל "בריבית 4.5%") לחישוב מדויק יותר.`);
  }
  if(company && company.maxTermYears && termYears > company.maxTermYears){
    assumptions.push(`שימו לב: התקופה שביקשת (${termYears} שנים) חורגת מהתקופה המקסימלית של ${company.name} (${company.maxTermYears} שנים) לפי המידע שבידינו.`);
  }
  if(company && !company.methods.includes(method)){
    assumptions.push(`שימו לב: לפי המידע שבידינו, ${company.name} לא מציעה מסלול ${METHOD_LABELS[method]} בנפרד.`);
  }

  const r = annualRate/100/12;
  let result, fields;
  if(method==='shpitzer'){
    result = computeShpitzer(P, r, termMonths);
    fields = [
      ['תשלום חודשי', '₪'+Math.round(result.pmt).toLocaleString('he-IL')],
      ['סה״כ ריבית', '₪'+Math.round(result.totalInterest).toLocaleString('he-IL')],
      ['סה״כ החזר כולל', '₪'+Math.round(result.totalPaid).toLocaleString('he-IL')],
    ];
  } else if(method==='balloon'){
    result = computeBalloon(P, r, termMonths);
    fields = [
      ['קרן ההלוואה (משולמת בסוף)', '₪'+Math.round(P).toLocaleString('he-IL')],
      ['סה״כ ריבית (ריבית דריבית)', '₪'+Math.round(result.totalInterest).toLocaleString('he-IL')],
      ['סכום החזר כולל בסוף', '₪'+Math.round(result.totalPaid).toLocaleString('he-IL')],
    ];
  } else {
    result = computeGrace(P, r, termMonths);
    fields = [
      ['תשלום חודשי (ריבית בלבד)', '₪'+Math.round(result.pmt).toLocaleString('he-IL')],
      ['תשלום אחרון (קרן+ריבית)', '₪'+Math.round(result.finalPayment).toLocaleString('he-IL')],
      ['סה״כ ריבית לתקופה', '₪'+Math.round(result.totalInterest).toLocaleString('he-IL')],
    ];
  }

  if(assumptions.length){
    const a = document.createElement('div');
    a.className = 'bot-assume';
    a.textContent = assumptions.join(' ');
    container.appendChild(a);
  }

  const card = document.createElement('div');
  card.className = 'bot-card';
  const titleCompany = company ? company.name : 'ריבית פריים כללית';
  card.innerHTML = `<div class="bot-card-title">${METHOD_LABELS[method]} — ${titleCompany} — ₪${Math.round(P).toLocaleString('he-IL')} ל-${termYears} שנים</div>`;
  fields.forEach(([label,val])=>{
    const row = document.createElement('div');
    row.className = 'bot-field';
    row.innerHTML = `<span class="bot-field-label">${label}</span><span class="bot-field-value"></span>`;
    row.querySelector('.bot-field-value').textContent = val;
    card.appendChild(row);
  });
  const rateRow = document.createElement('div');
  rateRow.className = 'bot-field';
  rateRow.innerHTML = `<span class="bot-field-label">ריבית שנתית בשימוש</span><span class="bot-field-value"></span>`;
  rateRow.querySelector('.bot-field-value').textContent = annualRate.toFixed(2)+'%';
  card.insertBefore(rateRow, card.firstChild.nextSibling);
  container.appendChild(card);

  // cross-link to institution codes for the same company
  if(company && company.institutionKey && DATA[company.institutionKey]){
    const btn = document.createElement('button');

      handleChatSubmit(new Event('submit', {cancelable:true}));
    });

  }
}

const STANDARD_CATEGORIES = ["ביטוח","פוליסה פיננסית","קרן פנסיה","קרן השתלמות","קופת גמל","קופת גמל להשקעה","חיסכון","אחר"];

function getCompanyProducts(key){
  const c = DATA[key];
  const products = [];
  c.sections.forEach(sec=>{
    if(sec.excludeFromPicker) return;
    if(sec.type === 'table'){
      sec.rows.forEach((row,i)=>{
        const category = (sec.rowCategories && sec.rowCategories[i]) || sec.category || sec.title;
        products.push({ category, columns: sec.columns, values: row, note: sec.note || null });
      });
    } else if(sec.type === 'subgrouped'){
      sec.groups.forEach(g=>{
        if(g.excludeFromPicker) return;
        g.rows.forEach((row,i)=>{
          const category = (g.rowCategories && g.rowCategories[i]) || g.category || g.subtitle;
          products.push({ category, columns: g.columns, values: row, note: g.note || sec.note || null });
        });
      });
    }
  });
  const counts = {};
  products.forEach(p=>{ counts[p.values[0]] = (counts[p.values[0]]||0)+1; });
  products.forEach(p=>{
    p.label = (counts[p.values[0]] > 1 && p.values.length > 1) ? (p.values[0] + ' — ' + p.values[1]) : p.values[0];
    p.context = p.category;
  });
  products.sort((a,b)=>{
    const ia = STANDARD_CATEGORIES.indexOf(a.category); const ib = STANDARD_CATEGORIES.indexOf(b.category);
    const oa = ia === -1 ? 999 : ia; const ob = ib === -1 ? 999 : ib;
    return oa - ob;
  });
  return products;
}

// ---------- chat engine ----------
const STOPWORDS = new Set(["מה","מהו","מהי","מהם","של","את","איזה","איזו","איזהו","תן","לי","בבקשה","עבור","אני","רוצה","לדעת","מספר","הוא","היא","הם","גם","עם","יש","לא","כן","ה","ב","ל","מ","ו","זה","זאת","אלו","איך","כמה","נא","תוכל","תוכלי","אפשר"]);

function buildKnowledgeBase(){
  const kb = [];
  order.forEach(key=>{
    const c = DATA[key];
    getCompanyProducts(key).forEach(p=>{
      const searchText = [c.name, c.fullName, p.category, p.label, p.columns.join(' '), p.values.join(' ')].join(' ').toLowerCase();
      kb.push({ domain:'מוסד', domainIcon:'🏦', companyKey:key, companyName:c.name, category:p.category, label:p.label, columns:p.columns, values:p.values, searchText });
    });
  });
  return kb;
}
let KB = null;

const HEB_PREFIXES = ['ש','כ','ל','מ','ב','ו','ה'];
function stripPrefixVariants(t){
  const variants = [t];
  let cur = t;
  // strip up to 2 chained single-letter prefixes (e.g. "ולפדיון" -> "לפדיון" -> "פדיון")
  for(let i=0;i<2;i++){
    if(cur.length > 3 && HEB_PREFIXES.includes(cur[0])){
      cur = cur.slice(1);
      variants.push(cur);
    } else break;
  }
  return variants;
}

function tokenize(q){
  return q.toLowerCase().split(/[\s,.\/\-–—:]+/).map(t=>t.trim()).filter(t=>t.length>=2 && !STOPWORDS.has(t));
}

function answerQuestion(q){
  if(!KB) KB = buildKnowledgeBase();
  const qLower = q.toLowerCase();

  // direct account-number style lookup: sequence of 5+ digits
  const numMatch = qLower.match(/\d{5,}/);
  if(numMatch){
    const num = numMatch[0];
    const hits = KB.filter(item => item.values.some(v => String(v).replace(/[^\d]/g,'').includes(num)));
    if(hits.length) return { hits, note: null };
  }

  const tokens = tokenize(qLower);
  if(!tokens.length) return { hits: [], note: "לא הבנתי את השאלה — אפשר לנסח מחדש? למשל: \"מה מספר החשבון של מור פנסיה מקיפה\"." };

  let scored = KB.map(item=>{
    let score = 0;
    tokens.forEach(t=>{
      const variants = stripPrefixVariants(t);
      // use the longest (most specific) variant that actually matches, weight full-length token higher
      variants.forEach((v,vi)=>{
        const weight = vi === 0 ? 1 : 0.85; // slight discount for stripped-prefix matches to prefer exact tokens
        if(item.companyName.toLowerCase().includes(v)) score += 3*weight;
        if(item.category.toLowerCase().includes(v)) score += 2*weight;
        if(item.label.toLowerCase().includes(v)) score += 2*weight;
        if(item.searchText.includes(v)) score += 1*weight;
      });
    });
    return { item, score };
  }).filter(s=>s.score>0);

  if(!scored.length) return { hits: [], note: "לא מצאתי התאמה. נסי לציין שם חברה ומוצר, למשל: \"קוד מוסד של הפניקס גמל\"." };

  scored.sort((a,b)=>b.score-a.score);
  const topScore = scored[0].score;
  const hits = scored.filter(s=>s.score === topScore).slice(0,6).map(s=>s.item);
  return { hits, note: null };
}

function renderBotAnswer(container, result){
  if(result.note){
    const p = document.createElement('div');
    p.textContent = result.note;
    container.appendChild(p);
    return;
  }
  if(result.hits.length === 1){
    const h = result.hits[0];
    const card = document.createElement('div');
    card.className = 'bot-card';
    card.innerHTML = `<div class="bot-card-title">${h.companyName} — ${h.label}</div>`;
    h.columns.forEach((colName,i)=>{
      const val = h.values[i];
      if(val === undefined || val === '') return;
      const row = document.createElement('div');
      row.className = 'bot-field';
      row.innerHTML = `<span class="bot-field-label">${colName}</span><span class="bot-field-value"></span>`;
      row.querySelector('.bot-field-value').textContent = val;
      card.appendChild(row);
    });
    container.appendChild(card);
    const loanKey = INSTITUTION_TO_LOAN[h.companyKey];
    if(loanKey){
      const btn = document.createElement('button');
      btn.className = 'bot-crosslink';
      btn.textContent = `🔗 לבדוק גם הלוואה מ${LOAN_COMPANIES[loanKey].name}?`;
      btn.addEventListener('click', ()=>{
        chatInput.value = `שפיצר 100000 ל-5 שנים ב${LOAN_COMPANIES[loanKey].name}`;
        handleChatSubmit(new Event('submit', {cancelable:true}));
      });
      container.appendChild(btn);
    }
  } else {
    const intro = document.createElement('div');
    intro.textContent = `מצאתי כמה התאמות (${result.hits.length}) — הנה הפרטים:`;
    container.appendChild(intro);
    result.hits.forEach(h=>{
      const card = document.createElement('div');
      card.className = 'bot-card';
      card.innerHTML = `<div class="bot-card-title">${h.companyName} — ${h.label}</div>`;
      h.columns.forEach((colName,i)=>{
        const val = h.values[i];
        if(val === undefined || val === '') return;
        const row = document.createElement('div');
        row.className = 'bot-field';
        row.innerHTML = `<span class="bot-field-label">${colName}</span><span class="bot-field-value"></span>`;
        row.querySelector('.bot-field-value').textContent = val;
        card.appendChild(row);
      });
      container.appendChild(card);
    });
  }
}

function addChatMessage(text, sender){
  const bubble = document.createElement('div');
  bubble.className = 'chat-bubble ' + sender;
  if(sender === 'user'){
    bubble.textContent = text;
  }
  chatLog.appendChild(bubble);
  chatLog.scrollTop = chatLog.scrollHeight;
  return bubble;
}

function handleChatSubmit(e){
  e.preventDefault();
  const val = chatInput.value.trim();
  if(!val) return;
  addChatMessage(val, 'user');
  chatInput.value = '';
  const botBubble = addChatMessage('', 'bot');
  if(isLoanQuestion(val.toLowerCase())){
    renderLoanAnswer(botBubble, val);
  } else {
    const result = answerQuestion(val);
    renderBotAnswer(botBubble, result);
  }
  chatLog.scrollTop = chatLog.scrollHeight;
}
