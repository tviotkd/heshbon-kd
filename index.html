<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מחולל קודי מוסד ופרטי חשבון | קפלן דהאן</title>
<style>
  :root{
    --navy:#0f2942;
    --navy-2:#16385a;
    --gold:#b98a3d;
    --gold-light:#e8c58a;
    --bg:#f4f6f8;
    --card:#ffffff;
    --line:#e1e6ea;
    --text:#1c2b38;
    --text-dim:#5b6b78;
    --green:#2f7a4f;
    --green-bg:#eaf6ef;
    --red:#b3432b;
    --red-bg:#fdecE8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Segoe UI','Arial Hebrew','Heebo',Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  header{
    background:linear-gradient(120deg,var(--navy) 0%,var(--navy-2) 100%);
    color:#fff;
    padding:28px 20px 24px;
    position:sticky;
    top:0;
    z-index:50;
    box-shadow:0 2px 12px rgba(0,0,0,.15);
  }
  header .inner{
    max-width:1100px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  header h1{
    margin:0;
    font-size:22px;
    font-weight:700;
    letter-spacing:.2px;
  }
  header .sub{
    font-size:13px;
    color:var(--gold-light);
    margin-top:4px;
    font-weight:500;
  }
  .search-wrap{
    position:relative;
    min-width:260px;
    flex:0 0 auto;
  }
  .search-wrap input{
    width:100%;
    padding:11px 40px 11px 14px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08);
    color:#fff;
    font-size:14px;
    outline:none;
  }
  .search-wrap input::placeholder{color:rgba(255,255,255,.55);}
  .search-wrap input:focus{
    border-color:var(--gold-light);
    background:rgba(255,255,255,.14);
  }
  .search-wrap svg{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    opacity:.6;
  }

  .layout{
    max-width:1100px;
    margin:0 auto;
    padding:22px 18px 60px;
    display:grid;
    grid-template-columns:220px 1fr;
    gap:22px;
    align-items:start;
  }
  @media (max-width:800px){
    .layout{grid-template-columns:1fr;}
  }

  nav.companies{
    position:sticky;
    top:112px;
    display:flex;
    flex-direction:column;
    gap:6px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px;
  }
  @media (max-width:800px){
    nav.companies{
      position:static;
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
    }
  }
  nav.companies button{
    all:unset;
    cursor:pointer;
    padding:10px 12px;
    border-radius:9px;
    font-size:14px;
    font-weight:600;
    color:var(--text);
    text-align:center;
    transition:background .15s,color .15s;
  }
  nav.companies button:hover{background:var(--bg);}
  nav.companies button.active{
    background:var(--navy);
    color:#fff;
  }
  nav.companies .missing-btn{
    color:var(--text-dim);
    font-weight:500;
    font-size:12.5px;
    cursor:default;
  }
  nav.companies .missing-btn:hover{background:none;}
  nav.companies .divider{
    border-top:1px solid var(--line);
    margin:6px 4px;
  }
  nav.companies .group-label{
    font-size:11px;
    color:var(--text-dim);
    padding:6px 10px 2px;
    font-weight:700;
    letter-spacing:.3px;
  }

  main{min-width:0;}

  .company-panel{display:none;}
  .company-panel.active{display:block; animation:fadeIn .18s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .company-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:16px;
  }
  .company-head h2{
    margin:0;
    font-size:21px;
    color:var(--navy);
  }
  .company-head .tag{
    font-size:12px;
    background:var(--gold);
    color:#fff;
    padding:4px 10px;
    border-radius:20px;
    font-weight:700;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 18px 20px;
    margin-bottom:16px;
  }
  .card h3{
    margin:0 0 12px;
    font-size:15px;
    color:var(--navy-2);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card h3 .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--gold);
    display:inline-block;
  }
  .card .note{
    font-size:13px;
    color:var(--text-dim);
    background:var(--bg);
    border-radius:8px;
    padding:8px 12px;
    margin-top:10px;
  }
  .compact-card{
    padding:12px 14px 14px;
    max-width:480px;
  }
  .compact-card h3{
    font-size:12.5px;
    color:var(--text-dim);
    margin-bottom:8px;
  }
  .compact-card table{font-size:12px;}
  .compact-card th{font-size:11px; padding:6px 8px;}
  .compact-card td{padding:6px 8px;}
  .compact-card .note{font-size:11.5px; padding:6px 10px;}

  table{
    width:100%;
    border-collapse:collapse;
    font-size:13.5px;
  }
  th,td{
    padding:9px 10px;
    text-align:right;
    border-bottom:1px solid var(--line);
    vertical-align:top;
  }
  th{
    color:var(--text-dim);
    font-weight:700;
    font-size:12.5px;
    background:var(--bg);
    position:sticky;
    top:0;
  }
  tr:last-child td{border-bottom:none;}
  td.code, td.acct{
    font-variant-numeric:tabular-nums;
    font-family:'Consolas','Courier New',monospace;
    font-weight:700;
    color:var(--navy);
    direction:ltr;
    text-align:left;
    unicode-bidi:plaintext;
  }
  .table-scroll{overflow-x:auto;}

  .subgroup{margin-top:14px;}
  .subgroup > .subtitle{
    font-size:13px;
    font-weight:700;
    color:var(--text);
    margin:14px 0 8px;
    padding-right:10px;
    border-right:3px solid var(--gold);
  }

  .copy-btn{
    all:unset;
    cursor:pointer;
    font-size:11px;
    color:var(--navy-2);
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:6px;
    padding:2px 7px;
    margin-right:6px;
    font-family:inherit;
    font-weight:600;
  }
  .copy-btn:hover{background:#e6ecf1;}
  .copy-btn.copied{background:var(--green-bg); color:var(--green); border-color:var(--green);}

  .links-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
  }
  .links-row a{
    font-size:12.5px;
    color:var(--navy-2);
    background:var(--bg);
    border:1px solid var(--line);
    padding:6px 12px;
    border-radius:8px;
    text-decoration:none;
    font-weight:600;
  }
  .links-row a:hover{background:#e6ecf1;}

  .missing-panel .card{border-style:dashed;}
  .missing-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
  }
  .missing-list span{
    background:var(--red-bg);
    color:var(--red);
    font-size:13px;
    font-weight:700;
    padding:6px 14px;
    border-radius:20px;
  }

  .hidden-row{display:none !important;}

  footer{
    text-align:center;
    font-size:12px;
    color:var(--text-dim);
    padding:20px;
  }

  ::selection{background:var(--gold-light);}
</style>

          {
            subtitle: "מנורה מבטחים גמל להשקעה (תיק ניכויים 935366286)",
            columns:["שם קופ\"ג","מ\"ה","חשבון עו\"ש"],
            rows:[
              ["מנורה מבטחים גמל להשקעה","8675","21636108"],
            ]
          },
          {
            subtitle: "מנורה מבטחים קרן השתלמות (תיק ניכויים 935825711)",
            columns:["שם קה\"ש","מ\"ה","חשבון עו\"ש"],

const MISSING = [];

// ---------- render ----------

const nav = document.getElementById('companyNav');
const mainArea = document.getElementById('mainArea');
const order = ["clal","altshuler","analyst","yelin","migdal","meitav","phoenix","mor","ayalon","hachshara","harel","menora"];

function renderNav(){
  order.forEach((key,i)=>{
    const btn = document.createElement('button');
    btn.textContent = DATA[key].name;
    btn.dataset.key = key;
    if(i===0) btn.classList.add('active');
    btn.addEventListener('click', ()=> selectCompany(key));
    nav.appendChild(btn);
  });
  if(MISSING.length){
    const divider = document.createElement('div');
    divider.className = 'divider';
    nav.appendChild(divider);
    const label = document.createElement('div');
    label.className = 'group-label';
    label.textContent = 'טרם התקבל';
    nav.appendChild(label);
    MISSING.forEach(name=>{
      const d = document.createElement('div');
      d.className = 'missing-btn';
      d.textContent = name;
      nav.appendChild(d);
    });
  }
}

function makeTable(cols, rows, codeColsIdx){
  const wrap = document.createElement('div');
  wrap.className = 'table-scroll';
  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  cols.forEach(c=>{
    const th = document.createElement('th');
    th.textContent = c;
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    tr.dataset.search = r.join(' ').toLowerCase();
    r.forEach((cell,ci)=>{
      const td = document.createElement('td');
      const isCodeCol = ci>0; // all columns except the first (label) treated as data/code style
      if(isCodeCol && cell && cell !== "—"){
        td.classList.add('code');
        const span = document.createElement('span');
        span.textContent = cell;
        td.appendChild(span);
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = 'העתק';
        btn.addEventListener('click', ()=>copyText(cell, btn));
        td.appendChild(btn);
      } else {
        td.textContent = cell;
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}

function copyText(text, btn){
  navigator.clipboard.writeText(text).then(()=>{
    const old = btn.textContent;
    btn.textContent = 'הועתק ✓';
    btn.classList.add('copied');
    setTimeout(()=>{btn.textContent=old; btn.classList.remove('copied');}, 1400);
  });
}

function renderCompany(key){
  const c = DATA[key];
  const panel = document.createElement('div');
  panel.className = 'company-panel';
  panel.id = 'panel-'+key;
  panel.dataset.key = key;

  const head = document.createElement('div');
  head.className = 'company-head';
  head.innerHTML = `<h2>${c.name}</h2><span class="tag">${c.fullName}</span>`;
  panel.appendChild(head);

  c.sections.forEach(sec=>{
    const card = document.createElement('div');
    card.className = 'card' + (sec.compact ? ' compact-card' : '');
    card.dataset.search = (sec.title||'').toLowerCase();
    const h3 = document.createElement('h3');
    h3.innerHTML = `<span class="dot"></span>${sec.title}`;
    card.appendChild(h3);

    if(sec.type === 'table'){
      card.appendChild(makeTable(sec.columns, sec.rows));
    } else if(sec.type === 'subgrouped'){
      sec.groups.forEach(g=>{
        const sg = document.createElement('div');
        sg.className = 'subgroup';
        const st = document.createElement('div');
        st.className = 'subtitle';
        st.textContent = g.subtitle;
        sg.appendChild(st);
        sg.appendChild(makeTable(g.columns, g.rows));
        if(g.note){
          const n = document.createElement('div');
          n.className = 'note';
          n.textContent = g.note;
          sg.appendChild(n);
        }
        card.appendChild(sg);
      });
    }

    if(sec.note){
      const n = document.createElement('div');
      n.className = 'note';
      n.textContent = sec.note;
      card.appendChild(n);
    }
    panel.appendChild(card);
  });

  if(c.notes && c.notes.length){
    const card = document.createElement('div');
    card.className = 'card';
    const h3 = document.createElement('h3');
    h3.innerHTML = `<span class="dot"></span>הערות והנחיות`;
    card.appendChild(h3);
    c.notes.forEach(t=>{
      const n = document.createElement('div');
      n.className = 'note';
      n.style.marginTop = '8px';
      n.textContent = t;
      card.appendChild(n);
    });
    panel.appendChild(card);
  }

  if(c.links && c.links.length){
    const row = document.createElement('div');
    row.className = 'links-row';
    c.links.forEach(l=>{
      const a = document.createElement('a');
      a.href = l.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = l.label;
      row.appendChild(a);
    });
    panel.appendChild(row);
  }

  mainArea.appendChild(panel);
}

function selectCompany(key){
  document.querySelectorAll('nav.companies button').forEach(b=>{
    b.classList.toggle('active', b.dataset.key === key);
  });
  document.querySelectorAll('.company-panel').forEach(p=>{
    p.classList.toggle('active', p.dataset.key === key);
  });
}

renderNav();
order.forEach(renderCompany);
selectCompany(order[0]);

// ---------- search ----------
const searchBox = document.getElementById('searchBox');
searchBox.addEventListener('input', ()=>{
  const q = searchBox.value.trim().toLowerCase();
  if(!q){
    document.querySelectorAll('tr').forEach(tr=>tr.classList.remove('hidden-row'));
    document.querySelectorAll('.card').forEach(c=>c.classList.remove('hidden-row'));
    return;
  }
  // search across all companies: find matches in rows, auto-switch to first matching company
  let firstMatchKey = null;
  order.forEach(key=>{
    const panel = document.getElementById('panel-'+key);
    let anyMatchInPanel = false;
    panel.querySelectorAll('tbody tr').forEach(tr=>{
      const match = tr.dataset.search && tr.dataset.search.includes(q);
      tr.classList.toggle('hidden-row', !match);
      if(match) anyMatchInPanel = true;
    });
    // also match company name itself
    if(DATA[key].name.toLowerCase().includes(q) || DATA[key].fullName.toLowerCase().includes(q)){
      anyMatchInPanel = true;
      panel.querySelectorAll('tbody tr').forEach(tr=>tr.classList.remove('hidden-row'));
    }
    if(anyMatchInPanel && !firstMatchKey) firstMatchKey = key;
  });
  if(firstMatchKey) selectCompany(firstMatchKey);
});

// ---------- prefill search from URL (?q=...) so a link can jump straight to an account number ----------
(function(){
  const params = new URLSearchParams(window.location.search);
  const q = params.get('q');
  if(q){
    searchBox.value = q;
    searchBox.dispatchEvent(new Event('input'));
  }
})();
</script>
